[project]
name = "pylkutus"
version = "0.1.0"
description = "Suomen kielen pilkkutarkistin"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stanza: käyttää Stanza-jäsennintä (hidas)",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pylkutus", "pylkutus.saannot"]
